name: Validate plugin
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifests and skills
        run: node -e "const fs=require(\"fs\");for(const f of [\".claude-plugin/plugin.json\",\".claude-plugin/marketplace.json\"])JSON.parse(fs.readFileSync(f,\"utf8\"));const s=fs.readdirSync(\"skills\");for(const d of s)if(!fs.existsSync(\"skills/\"+d+\"/SKILL.md\"))throw new Error(\"missing SKILL.md: \"+d);console.log(\"OK\",s.length,\"skills\",fs.readdirSync(\"agents\").length,\"agents\")"
